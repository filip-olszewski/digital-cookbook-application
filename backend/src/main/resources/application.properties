spring.application.name=Digital Cookbook API

# H2 db
spring.datasource.url=jdbc:h2:mem:cookbookdb;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=false

# Naming strategy (camelCase -> snake_case)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# Page defaults
spring.data.web.pageable.default-page-size=24
spring.data.web.pageable.max-page-size=48

# SQL
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
