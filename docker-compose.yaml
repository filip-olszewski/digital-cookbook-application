services:
  digital-cookbook:
    container_name: cookbook
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/cookbookdb
      DB_PASSWORD: password
      DB_USER: user
    ports:
      - "8080:8080"
    
  postgres:
    container_name: cookbook-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cookbookdb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: