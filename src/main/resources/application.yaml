spring:
  application:
    name: digital-cookbook-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cookbookdb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:root}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        naming:
          physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    show-sql: false
    defer-datasource-initialization: false
  data:
    web:
      pageable:
        default-page-size: 24
        max-page-size: 48

rsa:
  public-key: ${RSA_PUBLIC_KEY}
  private-key: ${RSA_PRIVATE_KEY}

jwt:
  expiration-seconds: 1800
  refresh-expiration-seconds: 604800 # One week

app:
  cors:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
  storage:
    cloudflare:
      r2:
        access-key-id: ${R2_ACCESS_KEY_ID}
        secret-access-key: ${R2_SECRET_ACCESS_KEY}
        account-id: ${R2_ACCOUNT_ID}
        bucket: ${R2_BUCKET_NAME}
        region: auto

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: info
    io.github.filipolszewski.cookbook: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
