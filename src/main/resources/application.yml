spring:
  application:
    name: digital-cookbook-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cookbookdb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:root}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        naming:
          physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    show-sql: true
    defer-datasource-initialization: false

  sql:
    init:
      mode: always

  data:
    web:
      pageable:
        default-page-size: 24
        max-page-size: 48

rsa:
  public-key: classpath:certs/public.pem
  private-key: classpath:certs/private.pem

jwt:
  expiration-seconds: 3600
  refresh-expiration-seconds: 604800 # One week

app:
  cors:
    allowed-origins:
      - "http://localhost:5173"
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
  storage:
    cloudflare:
      r2:
        access-key-id: ${R2_ACCESS_KEY_ID}
        secret-access-key: ${R2_SECRET_ACCESS_KEY}
        region: auto
        account-id: fd24ea02c7bf70875ea5945824fcd6cd
        bucket: digital-cookbook-bucket

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: info
    io.github.filipolszewski.cookbook: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
